name: Test source release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      SPRITE_REQUIRE_OPENBLAS_CHECKS: '1'
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt 'threadpoolctl>=3.6,<4'
      - run: PYTHONPATH=tests python -m unittest test_blas_capabilities test_source_hem_mapping -v
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_coordinates.cjs
      - run: node tests/test_playback.cjs
      - run: node tests/test_project_load.cjs
      - run: node tests/test_render_status.cjs
      - run: node --check web/app.js
      - run: python scripts/check_public_release.py
      - run: python cli.py --view side --action walk --output output/smoke
      - run: python layered_motion.py --demo output/layered
      - run: python dash_project.py demo output/dash-example
      - run: python dash_project.py verify output/dash-example/project.json output/dash-example/rendered
      - run: python pose_review.py --root output/pose-review demo
      - run: python pose_review.py --root output/pose-review check manifest.json review.json --out check.json
